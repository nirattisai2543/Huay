<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบสุ่มหวย Napas1805 - Final Complete</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/interactjs/dist/interact.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Charmonman:wght@400;700&family=Sarabun:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { margin: 0; padding: 20px; background-color: #0b0b0b; font-family: 'Sarabun', sans-serif; color: white; min-height: 100vh; display: flex; flex-direction: column; align-items: center; }
        #page-menu, #page-main { width: 100%; max-width: 600px; }
        #page-main { display: none; text-align: center; }
        .button-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 10px; }
        .btn-action { padding: 12px; font-size: 14px; font-weight: bold; border: none; border-radius: 10px; cursor: pointer; color: #fff; }
        .full-width { grid-column: span 2; }
        .nav-grid { display: grid; grid-template-columns: 1fr 2fr 1fr; gap: 8px; margin-bottom: 10px; }
        .search-input { width: 90%; padding: 12px; margin: 0 auto 15px; display: block; border-radius: 25px; border: 1px solid #b8860b; background: #222; color: white; text-align: center; }
        .btn-folder { width: 100%; padding: 15px; background: #222; border: 2px solid #b8860b; color: #ffd700; border-radius: 12px; margin-bottom: 10px; cursor: pointer; font-size: 16px; font-weight: bold; }
        .lottery-list { display: none; flex-wrap: wrap; gap: 5px; justify-content: center; background: #1a1a1a; padding: 10px; border-radius: 10px; margin-bottom: 15px; }
        .lottery-list.active { display: flex; }
        .btn-lotto { padding: 8px 12px; background: #333; border: 1px solid #555; color: #fff; cursor: pointer; border-radius: 5px; font-size: 13px; }
        .container { position: relative; width: 100%; aspect-ratio: 2 / 3; background-image: url('20183.png'); background-size: cover; background-position: center; border-radius: 10px; margin: 0 auto; overflow: hidden; }
        .number-box { position: absolute; font-weight: 700; color: #3a1a02; text-align: center; font-family: 'Charmonman'; touch-action: none; cursor: pointer; border: 2px solid transparent; }
        .number-box.selected { border: 2px solid #ffd700 !important; background: rgba(255, 255, 255, 0.1); }
        .date-control { background: #222; padding: 10px; border-radius: 10px; border: 1px solid #b8860b; display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
    </style>
</head>
<body>

<div id="page-menu">
    <h2 style="text-align:center; color:#ffd700;">เลือกหมวดหมู่หวย</h2>
    <input type="text" class="search-input" placeholder="🔍 ค้นหาชื่อหวย..." oninput="filterLottery(this.value)">
    <div id="menu"></div>
</div>

<div id="page-main">
    <div class="nav-grid">
        <button class="btn-action" style="background:#555;" onclick="moveLotto(-1)">◀ ก่อนหน้า</button>
        <button class="btn-action" style="background:#444;" onclick="showPage('page-menu')">เมนูหลัก</button>
        <button class="btn-action" style="background:#555;" onclick="moveLotto(1)">ถัดไป ▶</button>
    </div>
    
    <div class="date-control">
        <button onclick="adjustDate(-1)" style="border:none; background:#b8860b; color:white; padding:10px 20px; border-radius:5px; cursor:pointer;">- วัน</button>
        <span id="date-label" style="font-size:18px; font-weight:bold;"></span>
        <button onclick="adjustDate(1)" style="border:none; background:#b8860b; color:white; padding:10px 20px; border-radius:5px; cursor:pointer;">+ วัน</button>
    </div>

    <div class="button-grid">
        <button class="btn-action full-width" style="background:linear-gradient(45deg, #b8860b, #ffd700); color:#000;" onclick="genNumbers()">สุ่มเลขนำโชค</button>
        <button class="btn-action" id="lock-btn" onclick="toggleLock()" style="background:#333;">🔓 ปลดล็อค</button>
        <button class="btn-action" style="background:#cc0000;" onclick="resetAll()">🔄 รีเซ็ตทั้งหมด</button>
        <button class="btn-action full-width" style="background:#007bff;" onclick="prepareImage()">🖼️ สร้างรูปภาพใบหวย</button>
    </div>

    <div style="background:#1a1a1a; padding:10px; border-radius:10px; margin-bottom:15px;">
        <div style="font-size:14px; color:#ffd700;">ปรับขนาดเลข: <input type="range" id="size-slider" min="20" max="100" oninput="resizeSelected(this.value)"></div>
    </div>
    
    <div class="container" id="capture">
        <div id="title" class="number-box" style="top:35%; left:5%; width:90%; font-size:40px;">หวย</div>
        <div id="line" class="number-box" style="top:25%; left:45%; width:40%; font-size:13px; color:white; font-family:Sarabun;">napas1805</div>
        <div id="date-display" class="number-box" style="top:45%; left:5%; width:90%; font-size:24px; color:#3a1a02;"></div>
        <div id="wing" class="number-box" style="top:60%; left:5%; width:50%; font-size:50px;">...</div>
        <div id="den" class="number-box" style="top:60%; left:65%; width:25%; font-size:50px; color:red;">...</div>
        <div id="t1" class="number-box" style="top:74%; left:5%; width:25%; font-size:40px;">...</div>
        <div id="t2" class="number-box" style="top:74%; left:35%; width:25%; font-size:40px;">...</div>
        <div id="t3" class="number-box" style="top:74%; left:65%; width:25%; font-size:40px;">...</div>
        <div id="m1" class="number-box" style="top:86%; left:15%; width:30%; font-size:40px;">...</div>
        <div id="m2" class="number-box" style="top:86%; left:55%; width:30%; font-size:40px;">...</div>
    </div>
</div>

<script>
    let currentDate = new Date();
    const db = {
        "หวย จันทร์-ศุกร์": ["ลาว Extra", "นิเคอิเช้า VIP", "นอยอาเซียน", "นิเคอิเช้า", "จีนเช้า VIP", "จีนเช้า", "ลาว TV", "ฮั่งเส็งเช้า VIP", "ฮั่งเส็งเช้า", "ฮานอย HD", "ไต้หวัน VIP", "ฮานอย STAR", "ไต้หวัน", "เกาหลี", "เกาหลี VIP", "นิเคอิบ่าย", "นิเคอิบ่าย VIP", "ลาว HD", "จีนบ่าย", "ฮานอย TV", "จีนบ่าย VIP", "ฮั่งเส็งบ่าย", "ฮั่งเส็งบ่าย VIP", "ลาวสตาร์", "สิงคโปร์", "ไทยเย็น", "ฮานอยกาชาด", "อินเดีย", "สิงคโปร์ VIP", "อียิปต์", "ฮานอยสามัคคี", "ฮานอยพิเศษ", "ฮานอยปกติ", "ฮานอย VIP", "ฮานอยพัฒนา", "ลาวพัฒนา", "ลาวสามัคคี", "ลาวอาเซียน", "ลาว VIP", "ลาวสามัคคี VIP", "อังกฤษ VIP", "ลาวสตาร์ VIP", "ฮานอย Extra", "อังกฤษ", "เยอรมัน", "รัสเซีย", "เยอรมัน VIP", "ลาวกาชาด", "รัสเซีย VIP", "ดาวโจนส์ VIP", "ดาวโจนส์ STAR", "ดาวโจนส์"],
        "หวย เสาร์-อาทิตย์": ["ลาว Extra", "นิเคอิเช้า VIP", "นอยอาเซียน", "จีนเช้า VIP", "ลาว TV", "ฮั่งเส็งเช้า VIP", "ฮานอย HD", "ไต้หวัน VIP", "ฮานอย STAR", "เกาหลี VIP", "นิเคอิบ่าย VIP", "ลาว HD", "ฮานอย TV", "จีนบ่าย VIP", "ฮั่งเส็งบ่าย VIP", "ลาวสตาร์", "ฮานอยกาชาด", "สิงคโปร์ VIP", "ฮานอยพิเศษ", "ฮานอยสามัคคี", "ฮานอยปกติ", "ฮานอย VIP", "ฮานอยพัฒนา", "ลาวสามัคคี", "ลาวอาเซียน", "ลาว VIP", "ลาวสามัคคี VIP", "อังกฤษ VIP", "ลาวสตาร์ VIP", "ฮานอย Extra", "เยอรมัน VIP", "ลาวกาชาด", "รัสเซีย VIP", "ดาวโจนส์ VIP", "ดาวโจนส์ STAR"]
    };
    let currentFolder = "", currentIndex = 0, isLocked = false, selectedBox = null;

    function loadLotto(folder, index) { currentFolder = folder; currentIndex = index; document.getElementById('title').textContent = db[folder][index]; showPage('page-main'); genNumbers(); saveAll(); }
    function moveLotto(dir) { let newIndex = currentIndex + dir; if(newIndex >= 0 && newIndex < db[currentFolder].length) loadLotto(currentFolder, newIndex); }
    function updateDateUI() { const d = currentDate.toLocaleDateString('th-TH', { day: 'numeric', month: 'short', year: '2-digit' }); document.getElementById('date-label').textContent = d; document.getElementById('date-display').textContent = d; }
    function saveAll() { const state = {}; document.querySelectorAll('.number-box').forEach(b => { state[b.id] = { x: b.getAttribute('data-x')||0, y: b.getAttribute('data-y')||0, fs: b.style.fontSize, txt: b.textContent }; }); state['date'] = currentDate.toString(); state['folder'] = currentFolder; state['index'] = currentIndex; localStorage.setItem('napas_save', JSON.stringify(state)); }
    function loadAll() { const save = JSON.parse(localStorage.getItem('napas_save')); if(save) { currentDate = new Date(save.date); currentFolder = save.folder; currentIndex = save.index; Object.keys(save).forEach(id => { if(['date','folder','index'].includes(id)) return; const el = document.getElementById(id); if(el) { el.style.transform = `translate(${save[id].x}px, ${save[id].y}px)`; el.setAttribute('data-x', save[id].x); el.setAttribute('data-y', save[id].y); el.style.fontSize = save[id].fs; el.textContent = save[id].txt; } }); } updateDateUI(); }
    function showPage(p) { document.getElementById('page-menu').style.display = p=='page-menu'?'block':'none'; document.getElementById('page-main').style.display = p=='page-main'?'block':'none'; }
    function resetAll() { localStorage.removeItem('napas_save'); location.reload(); }
    function adjustDate(d) { currentDate.setDate(currentDate.getDate() + d); updateDateUI(); saveAll(); }
    
    // อัปเดตฟังก์ชันนี้ให้ดาวน์โหลดไฟล์โดยตรง
    function prepareImage() { 
        document.querySelectorAll('.number-box').forEach(b => b.classList.remove('selected')); 
        html2canvas(document.getElementById('capture'), { scale: 3, backgroundColor: null }).then(canvas => { 
            const link = document.createElement('a');
            link.download = 'lotto-result.png';
            link.href = canvas.toDataURL("image/png");
            link.click();
        }); 
    }
    
    function filterLottery(q) { q = q.toLowerCase(); document.querySelectorAll('.btn-lotto').forEach(b => { b.style.display = b.textContent.toLowerCase().includes(q) ? "block" : "none"; }); }
    function toggleLock() { isLocked = !isLocked; document.getElementById('lock-btn').textContent = isLocked ? "🔒 ล็อคแล้ว" : "🔓 ปลดล็อค"; document.getElementById('lock-btn').style.background = isLocked ? "#b8860b" : "#333"; }
    
    function genNumbers() {
        let w1, w2, den;
        w1 = Math.floor(Math.random()*10);
        do { w2 = Math.floor(Math.random()*10); } while (w2 === w1);
        do { den = Math.floor(Math.random()*10); } while (den === w1 || den === w2);
        document.getElementById('wing').textContent = w1 + " - " + w2;
        document.getElementById('den').textContent = den;
        const s = [w1, w2, den];
        document.querySelectorAll('#t1, #t2, #t3').forEach(el => {
            const p = s[Math.floor(Math.random()*s.length)];
            const o = Math.floor(Math.random()*10);
            el.textContent = Math.random() > 0.5 ? (p.toString()+o) : (o.toString()+p);
        });
        document.getElementById('m1').textContent = Math.floor(Math.random()*900+100);
        document.getElementById('m2').textContent = Math.floor(Math.random()*900+100);
        saveAll();
    }

    interact('.number-box').draggable({ listeners: { move(e) { if(!isLocked) { const t=e.target; const x=(parseFloat(t.getAttribute('data-x'))||0)+e.dx; const y=(parseFloat(t.getAttribute('data-y'))||0)+e.dy; t.style.transform=`translate(${x}px, ${y}px)`; t.setAttribute('data-x', x); t.setAttribute('data-y', y); saveAll(); } } } });
    document.querySelectorAll('.number-box').forEach(box => { box.onclick = (e) => { e.stopPropagation(); document.querySelectorAll('.number-box').forEach(b=>b.classList.remove('selected')); box.classList.add('selected'); selectedBox=box; document.getElementById('size-slider').value = parseInt(window.getComputedStyle(box).fontSize); }; });
    document.body.addEventListener('click', () => { document.querySelectorAll('.number-box').forEach(b => b.classList.remove('selected')); selectedBox = null; });
    function resizeSelected(v) { if(selectedBox) { selectedBox.style.fontSize = v + 'px'; saveAll(); } }
    
    const menu = document.getElementById('menu'); 
    Object.keys(db).forEach(f => { 
        let b = document.createElement('button'); b.className='btn-folder'; b.textContent=f; 
        let l = document.createElement('div'); l.className='lottery-list'; 
        b.onclick = () => { document.querySelectorAll('.lottery-list').forEach(i=>i.classList.remove('active')); l.classList.add('active'); }; 
        db[f].forEach((n, i) => { let s = document.createElement('button'); s.className='btn-lotto'; s.textContent=n; s.onclick = () => loadLotto(f, i); l.appendChild(s); }); 
        menu.appendChild(b); menu.appendChild(l); 
    });
    
    window.onload = loadAll;
</script>
</body>
</html>
