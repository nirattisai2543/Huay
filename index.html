<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบสุ่มหวย Napas1805</title>
    <script src="https://cdn.jsdelivr.net/npm/interactjs/dist/interact.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Charmonman:wght@400;700&family=Sarabun:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { margin: 0; padding: 20px; background-color: #0b0b0b; font-family: 'Sarabun', sans-serif; color: white; min-height: 100vh; display: flex; flex-direction: column; align-items: center; }
        #page-menu, #page-main { width: 100%; max-width: 600px; }
        #page-main { display: none; text-align: center; }
        .button-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 10px; }
        .btn-action { padding: 12px; font-size: 14px; font-weight: bold; border: none; border-radius: 10px; cursor: pointer; color: #fff; }
        .full-width { grid-column: span 2; }
        .nav-grid { display: grid; grid-template-columns: 1fr 2fr 1fr; gap: 8px; margin-bottom: 10px; }
        .search-input { width: 90%; padding: 12px; margin: 0 auto 15px; display: block; border-radius: 25px; border: 1px solid #b8860b; background: #222; color: white; text-align: center; }
        .btn-folder { width: 100%; padding: 15px; background: #222; border: 2px solid #b8860b; color: #ffd700; border-radius: 12px; margin-bottom: 10px; cursor: pointer; font-size: 16px; font-weight: bold; }
        .lottery-list { display: none; flex-wrap: wrap; gap: 5px; justify-content: center; background: #1a1a1a; padding: 10px; border-radius: 10px; margin-bottom: 15px; }
        .lottery-list.active { display: flex; }
        .btn-lotto { padding: 8px 12px; background: #333; border: 1px solid #555; color: #fff; cursor: pointer; border-radius: 5px; font-size: 13px; display: flex; align-items: center; gap: 8px; }
        .container { position: relative; width: 100%; aspect-ratio: 2 / 3; background-image: url('20183.png'); background-size: cover; background-position: center; border-radius: 10px; margin: 0 auto; overflow: hidden; cursor: pointer; }
        .number-box { position: absolute; font-weight: 700; color: #3a1a02; text-align: center; font-family: 'Charmonman'; touch-action: none; cursor: pointer; border: 2px solid transparent; }
        .date-control { background: #222; padding: 10px; border-radius: 10px; border: 1px solid #b8860b; display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
    </style>
</head>
<body>

<div id="page-menu">
    <h2 style="text-align:center; color:#ffd700;">เลือกหมวดหมู่หวย</h2>
    <input type="text" class="search-input" placeholder="🔍 ค้นหาชื่อหวย..." oninput="filterLottery(this.value)">
    <div id="menu"></div>
</div>

<div id="page-main">
    <div class="date-control">
        <button onclick="adjustDate(-1)" style="border:none; background:#b8860b; color:white; padding:10px 20px; border-radius:5px; cursor:pointer;">- วัน</button>
        <span id="date-label" style="font-size:18px; font-weight:bold;"></span>
        <button onclick="adjustDate(1)" style="border:none; background:#b8860b; color:white; padding:10px 20px; border-radius:5px; cursor:pointer;">+ วัน</button>
    </div>

    <div class="button-grid">
        <button class="btn-action full-width" style="background:linear-gradient(45deg, #b8860b, #ffd700); color:#000;" onclick="genNumbers()">สุ่มเลขนำโชค</button>
        <button class="btn-action full-width" style="background:linear-gradient(45deg, #228b22, #32cd32);" onclick="openForSave()">📸 บันทึกรูป (iOS/Android)</button>
        <button class="btn-action" id="lock-btn" onclick="toggleLock()" style="background:#333;">🔓 ปลดล็อค</button>
        <button class="btn-action" style="background:#cc0000;" onclick="resetAll()">🔄 รีเซ็ตทั้งหมด</button>
    </div>

    <div class="nav-grid">
        <button class="btn-action" style="background:#555;" onclick="moveLotto(-1)">◀ ก่อนหน้า</button>
        <button class="btn-action" style="background:#444;" onclick="showPage('page-menu')">เมนูหลัก</button>
        <button class="btn-action" style="background:#555;" onclick="moveLotto(1)">ถัดไป ▶</button>
    </div>
    
    <div class="container" id="capture">
        <div id="title" class="number-box" style="top:35%; left:5%; width:90%; font-size:40px;">หวย</div>
        <div id="line" class="number-box" style="top:25%; left:45%; width:40%; font-size:13px; color:white; font-family:Sarabun;">napas1805</div>
        <div id="date-display" class="number-box" style="top:45%; left:5%; width:90%; font-size:24px; color:#3a1a02;"></div>
        <div id="wing" class="number-box" style="top:60%; left:5%; width:50%; font-size:50px;">...</div>
        <div id="den" class="number-box" style="top:60%; left:65%; width:25%; font-size:50px; color:red;">...</div>
        <div id="t1" class="number-box" style="top:74%; left:5%; width:25%; font-size:40px;">...</div>
        <div id="t2" class="number-box" style="top:74%; left:35%; width:25%; font-size:40px;">...</div>
        <div id="t3" class="number-box" style="top:74%; left:65%; width:25%; font-size:40px;">...</div>
        <div id="m1" class="number-box" style="top:86%; left:15%; width:30%; font-size:40px;">...</div>
        <div id="m2" class="number-box" style="top:86%; left:55%; width:30%; font-size:40px;">...</div>
    </div>
</div>

<script>
    const db = {
        "หวย จันทร์-ศุกร์": [{n:"ลาว Extra", f:"la"}, {n:"นิเคอิเช้า VIP", f:"jp"}, {n:"นอยอาเซียน", f:"vn"}, {n:"นิเคอิเช้า", f:"jp"}, {n:"จีนเช้า VIP", f:"cn"}, {n:"จีนเช้า", f:"cn"}, {n:"ลาว TV", f:"la"}, {n:"ฮั่งเส็งเช้า VIP", f:"hk"}, {n:"ฮั่งเส็งเช้า", f:"hk"}, {n:"ฮานอย HD", f:"vn"}, {n:"ไต้หวัน VIP", f:"tw"}, {n:"ฮานอย STAR", f:"vn"}, {n:"ไต้หวัน", f:"tw"}, {n:"เกาหลี", f:"kr"}, {n:"เกาหลี VIP", f:"kr"}, {n:"นิเคอิบ่าย", f:"jp"}, {n:"นิเคอิบ่าย VIP", f:"jp"}, {n:"ลาว HD", f:"la"}, {n:"จีนบ่าย", f:"cn"}, {n:"ฮานอย TV", f:"vn"}, {n:"จีนบ่าย VIP", f:"cn"}, {n:"ฮั่งเส็งบ่าย", f:"hk"}, {n:"ฮั่งเส็งบ่าย VIP", f:"hk"}, {n:"ลาวสตาร์", f:"la"}, {n:"สิงคโปร์", f:"sg"}, {n:"ไทยเย็น", f:"th"}, {n:"ฮานอยกาชาด", f:"vn"}, {n:"อินเดีย", f:"in"}, {n:"สิงคโปร์ VIP", f:"sg"}, {n:"อียิปต์", f:"eg"}, {n:"ฮานอยสามัคคี", f:"vn"}, {n:"ฮานอยพิเศษ", f:"vn"}, {n:"ฮานอยปกติ", f:"vn"}, {n:"ฮานอย VIP", f:"vn"}, {n:"ฮานอยพัฒนา", f:"vn"}, {n:"ลาวพัฒนา", f:"la"}, {n:"ลาวสามัคคี", f:"la"}, {n:"ลาวอาเซียน", f:"la"}, {n:"ลาว VIP", f:"la"}, {n:"ลาวสามัคคี VIP", f:"la"}, {n:"อังกฤษ VIP", f:"gb"}, {n:"ลาวสตาร์ VIP", f:"la"}, {n:"ฮานอย Extra", f:"vn"}, {n:"อังกฤษ", f:"gb"}, {n:"เยอรมัน", f:"de"}, {n:"รัสเซีย", f:"ru"}, {n:"เยอรมัน VIP", f:"de"}, {n:"ลาวกาชาด", f:"la"}, {n:"รัสเซีย VIP", f:"ru"}, {n:"ดาวโจนส์ VIP", f:"us"}, {n:"ดาวโจนส์ STAR", f:"us"}, {n:"ดาวโจนส์", f:"us"}],
        "หวย เสาร์-อาทิตย์": [{n:"ลาว Extra", f:"la"}, {n:"นิเคอิเช้า VIP", f:"jp"}, {n:"นอยอาเซียน", f:"vn"}, {n:"จีนเช้า VIP", f:"cn"}, {n:"ลาว TV", f:"la"}, {n:"ฮั่งเส็งเช้า VIP", f:"hk"}, {n:"ฮานอย HD", f:"vn"}, {n:"ไต้หวัน VIP", f:"tw"}, {n:"ฮานอย STAR", f:"vn"}, {n:"เกาหลี VIP", f:"kr"}, {n:"นิเคอิบ่าย VIP", f:"jp"}, {n:"ลาว HD", f:"la"}, {n:"ฮานอย TV", f:"vn"}, {n:"จีนบ่าย VIP", f:"cn"}, {n:"ฮั่งเส็งบ่าย VIP", f:"hk"}, {n:"ลาวสตาร์", f:"la"}, {n:"ฮานอยกาชาด", f:"vn"}, {n:"สิงคโปร์ VIP", f:"sg"}, {n:"ฮานอยพิเศษ", f:"vn"}, {n:"ฮานอยสามัคคี", f:"vn"}, {n:"ฮานอยปกติ", f:"vn"}, {n:"ฮานอย VIP", f:"vn"}, {n:"ฮานอยพัฒนา", f:"vn"}, {n:"ลาวสามัคคี", f:"la"}, {n:"ลาวอาเซียน", f:"la"}, {n:"ลาว VIP", f:"la"}, {n:"ลาวสามัคคี VIP", f:"la"}, {n:"อังกฤษ VIP", f:"gb"}, {n:"ลาวสตาร์ VIP", f:"la"}, {n:"ฮานอย Extra", f:"vn"}, {n:"เยอรมัน VIP", f:"de"}, {n:"ลาวกาชาด", f:"la"}, {n:"รัสเซีย VIP", f:"ru"}, {n:"ดาวโจนส์ VIP", f:"us"}, {n:"ดาวโจนส์ STAR", f:"us"}]
    };

    let curF = "หวย จันทร์-ศุกร์", curI = 0, isLocked = false, curDate = new Date();

    function openForSave() {
        const c = document.createElement('canvas'), ctx = c.getContext('2d'), img = new Image();
        img.src = '20183.png';
        img.onload = () => {
            c.width = img.width; c.height = img.height; ctx.drawImage(img, 0, 0, c.width, c.height);
            const container = document.getElementById('capture');
            document.querySelectorAll('.number-box').forEach(box => {
                const s = window.getComputedStyle(box), rect = box.getBoundingClientRect(), cont = container.getBoundingClientRect();
                const centerX = (rect.left - cont.left + rect.width / 2) / container.offsetWidth;
                const centerY = (rect.top - cont.top + rect.height / 2) / container.offsetHeight;
                ctx.font = `bold ${parseFloat(s.fontSize) * (c.width / container.offsetWidth)}px ${s.fontFamily}`;
                ctx.fillStyle = box.id === 'den' ? 'red' : '#3a1a02';
                ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                ctx.fillText(box.textContent, centerX * c.width, centerY * c.height);
            });
            const newTab = window.open();
            newTab.document.write(`<img src="${c.toDataURL("image/png")}" style="width:100%">`);
            newTab.document.write('<p style="text-align:center; font-family:sans-serif;">กดค้างที่รูปภาพเพื่อบันทึก</p>');
        };
    }

    function loadLotto(f, i) { curF = f; curI = i; document.getElementById('title').textContent = db[f][i].n; showPage('page-main'); genNumbers(); save(); }
    function showPage(p) { document.getElementById('page-menu').style.display = p=='page-menu'?'block':'none'; document.getElementById('page-main').style.display = p=='page-main'?'block':'none'; }
    function moveLotto(d) { curI += d; if(curI < 0) curI = 0; if(curI >= db[curF].length) curI = db[curF].length - 1; loadLotto(curF, curI); }
    function adjustDate(d) { curDate.setDate(curDate.getDate() + d); const s = curDate.toLocaleDateString('th-TH', { day: 'numeric', month: 'short', year: '2-digit' }); document.getElementById('date-label').textContent = s; document.getElementById('date-display').textContent = s; save(); }
    
    function genNumbers() { 
        let w1=Math.floor(Math.random()*10), w2, den; 
        do{ w2=Math.floor(Math.random()*10); }while(w2===w1); 
        do{ den=Math.floor(Math.random()*10); }while(den===w1||den===w2); 
        document.getElementById('wing').textContent = w1 + " - " + w2; 
        document.getElementById('den').textContent = den; 
        const gL = () => { const o = [w1, w2, den]; const b = o[Math.floor(Math.random() * o.length)]; const r = Math.floor(Math.random() * 10); return Math.random() > 0.5 ? "" + b + r : "" + r + b; };
        document.getElementById('t1').textContent = gL(); document.getElementById('t2').textContent = gL(); document.getElementById('t3').textContent = gL();
        document.getElementById('m1').textContent=Math.floor(Math.random()*900+100); 
        document.getElementById('m2').textContent=Math.floor(Math.random()*900+100); 
        save(); 
    }

    function save() { const s = {}; document.querySelectorAll('.number-box').forEach(b => s[b.id] = {x:b.getAttribute('data-x')||0, y:b.getAttribute('data-y')||0, txt:b.textContent}); localStorage.setItem('napas', JSON.stringify({s, curF, curI, date:curDate})); }
    function load() { const d = JSON.parse(localStorage.getItem('napas')); if(d) { curF = d.curF; curI = d.curI; curDate = new Date(d.date); Object.keys(d.s).forEach(id => { const el=document.getElementById(id); if(el) { el.textContent=d.s[id].txt; el.style.transform=`translate(${d.s[id].x}px, ${d.s[id].y}px)`; el.setAttribute('data-x', d.s[id].x); el.setAttribute('data-y', d.s[id].y); } }); adjustDate(0); } }
    function toggleLock() { isLocked = !isLocked; document.getElementById('lock-btn').textContent = isLocked ? "🔒 ล็อคแล้ว" : "🔓 ปลดล็อค"; }
    function resetAll() { localStorage.removeItem('napas'); location.reload(); }
    function filterLottery(q) { document.querySelectorAll('.btn-lotto').forEach(b => b.style.display = b.textContent.toLowerCase().includes(q.toLowerCase()) ? "block" : "none"); }
    interact('.number-box').draggable({ listeners: { move(e) { if(!isLocked) { const t=e.target; const x=(parseFloat(t.getAttribute('data-x'))||0)+e.dx; const y=(parseFloat(t.getAttribute('data-y'))||0)+e.dy; t.style.transform=`translate(${x}px, ${y}px)`; t.setAttribute('data-x', x); t.setAttribute('data-y', y); save(); } } } });
    Object.keys(db).forEach(f => { let b=document.createElement('button'); b.className='btn-folder'; b.textContent=f; let l=document.createElement('div'); l.className='lottery-list'; b.onclick=() => { document.querySelectorAll('.lottery-list').forEach(i=>i.classList.remove('active')); l.classList.add('active'); }; db[f].forEach((item,i) => { let s=document.createElement('button'); s.className='btn-lotto'; let img = document.createElement('img'); img.src = `https://flagcdn.com/w20/${item.f}.png`; img.style.borderRadius="2px"; s.appendChild(img); s.append(item.n); s.onclick=(e)=>{e.stopPropagation(); loadLotto(f,i)}; l.appendChild(s); }); document.getElementById('menu').appendChild(b); document.getElementById('menu').appendChild(l); });
    window.onload = () => { load(); if(!localStorage.getItem('napas')) adjustDate(0); };
</script>
</body>
</html>
